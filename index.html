  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('corptcha-lang'); } catch (e) {}
      if (!saved) {
        var lang = (navigator.language || 'zh').toLowerCase();
        saved = lang.indexOf('en') === 0 ? 'en' : 'zh';
      }
      try { localStorage.setItem('corptcha-lang', saved); } catch (e) {}
      location.replace(saved === 'en' ? 'en/' : 'zh/');
    })();
  </script>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0d0c;
      color: #e6eeea;
    }
    .lang { color: #2489fd; font-size: 1.05rem; text-decoration: none; border-bottom: 1px solid rgba(36, 137, 253, 0.4); padding-bottom: 2px; }
    .lang:hover { border-bottom-color: #2489fd; }
    .hint { color: #66746e; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="hint">正在跳转到你的语言 / Redirecting to your language…</div>
